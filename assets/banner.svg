<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Ashwin Agrawal - Data Analyst and Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="0.6" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#05070a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .t1{font:700 54px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#f5f7fa;letter-spacing:1px}
    .t2{font:500 20px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#22d3ee;letter-spacing:3px}
    .t3{font:400 16px Consolas,'Courier New',monospace;fill:#8b98a5}
    .mono{font:400 12px Consolas,'Courier New',monospace;fill:#22d3ee;fill-opacity:.55}
    .scan{animation:scan 6s linear infinite}
    @keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(360px)}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite alternate}
    .b2{animation-delay:.4s}.b3{animation-delay:.8s}.b4{animation-delay:1.2s}.b5{animation-delay:1.6s}.b6{animation-delay:2s}
    @keyframes grow{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
    .spin{transform-origin:930px 170px;animation:spin 24s linear infinite}
    .spinR{transform-origin:930px 170px;animation:spin 36s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .stream{animation:stream 9s linear infinite}
    @keyframes stream{0%{transform:translateY(0)}100%{transform:translateY(-300px)}}
    .cursor{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
    .fadein{animation:fade 1.4s ease-out both}
    .d1{animation-delay:.3s}.d2{animation-delay:.6s}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- falling data stream, right side -->
    <g class="stream" opacity=".5">
      <text class="mono" x="1120" y="40">01101</text><text class="mono" x="1120" y="70">4f 2a</text>
      <text class="mono" x="1120" y="100">SELECT</text><text class="mono" x="1120" y="130">10010</text>
      <text class="mono" x="1120" y="160">AES</text><text class="mono" x="1120" y="190">7e 19</text>
      <text class="mono" x="1120" y="220">00111</text><text class="mono" x="1120" y="250">GROUP</text>
      <text class="mono" x="1120" y="280">TLS</text><text class="mono" x="1120" y="310">c3 0d</text>
      <text class="mono" x="1120" y="340">01101</text><text class="mono" x="1120" y="370">4f 2a</text>
      <text class="mono" x="1120" y="400">SELECT</text><text class="mono" x="1120" y="430">10010</text>
      <text class="mono" x="1120" y="460">AES</text><text class="mono" x="1120" y="490">7e 19</text>
      <text class="mono" x="1120" y="520">00111</text><text class="mono" x="1120" y="550">GROUP</text>
    </g>

    <!-- wireframe shield / hex geometry -->
    <g opacity=".9">
      <g class="spinR">
        <polygon points="930,60 1025,115 1025,225 930,280 835,225 835,115" fill="none" stroke="#22d3ee" stroke-opacity=".25" stroke-width="1.2"/>
        <line x1="930" y1="60" x2="930" y2="280" stroke="#22d3ee" stroke-opacity=".12"/>
        <line x1="835" y1="115" x2="1025" y2="225" stroke="#22d3ee" stroke-opacity=".12"/>
        <line x1="1025" y1="115" x2="835" y2="225" stroke="#22d3ee" stroke-opacity=".12"/>
      </g>
      <g class="spin">
        <polygon points="930,100 990,135 990,205 930,240 870,205 870,135" fill="none" stroke="#22d3ee" stroke-opacity=".5" stroke-width="1.4"/>
        <circle cx="930" cy="100" r="3" fill="#22d3ee"/><circle cx="990" cy="205" r="3" fill="#22d3ee"/><circle cx="870" cy="205" r="3" fill="#22d3ee"/>
      </g>
      <!-- lock in middle -->
      <g filter="url(#glow)" class="pulse">
        <rect x="912" y="168" width="36" height="28" rx="4" fill="none" stroke="#22d3ee" stroke-width="2"/>
        <path d="M919 168v-9a11 11 0 0 1 22 0v9" fill="none" stroke="#22d3ee" stroke-width="2"/>
        <circle cx="930" cy="181" r="3" fill="#22d3ee"/>
      </g>
    </g>

    <!-- small bar chart -->
    <g transform="translate(700,250)" opacity=".85">
      <line x1="0" y1="0" x2="110" y2="0" stroke="#8b98a5" stroke-opacity=".4"/>
      <rect class="bar" x="4" y="-40" width="12" height="40" rx="2" fill="#22d3ee" fill-opacity=".35"/>
      <rect class="bar b2" x="22" y="-62" width="12" height="62" rx="2" fill="#22d3ee" fill-opacity=".5"/>
      <rect class="bar b3" x="40" y="-30" width="12" height="30" rx="2" fill="#22d3ee" fill-opacity=".35"/>
      <rect class="bar b4" x="58" y="-78" width="12" height="78" rx="2" fill="#22d3ee" fill-opacity=".7"/>
      <rect class="bar b5" x="76" y="-52" width="12" height="52" rx="2" fill="#22d3ee" fill-opacity=".45"/>
      <rect class="bar b6" x="94" y="-90" width="12" height="90" rx="2" fill="#22d3ee" fill-opacity=".85"/>
    </g>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="1200" height="120" fill="url(#scan)"/>
    <rect width="1200" height="340" fill="url(#fadeR)"/>

    <!-- text -->
    <g class="fadein">
      <text class="t2" x="70" y="110">DATA ANALYST  ·  CYBERSECURITY</text>
    </g>
    <g class="fadein d1">
      <text class="t1" x="66" y="178">Ashwin Agrawal</text>
    </g>
    <g class="fadein d2">
      <text class="t3" x="70" y="222">$ finding patterns in data, and gaps in systems<tspan class="cursor" fill="#22d3ee">_</tspan></text>
      <text class="t3" x="70" y="256" style="font-size:14px">Chhatrapati Sambhajinagar, India</text>
    </g>
    <line x1="70" y1="132" x2="140" y2="132" stroke="#22d3ee" stroke-width="2"/>

    <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="#22d3ee" stroke-opacity=".18"/>
  </g>
</svg>
